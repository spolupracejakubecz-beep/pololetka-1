<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trénink – Pololetka 1.P</title>
<link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: věcný, povzbudivý trenažér před zkouškou
   IDEA: kartička s otázkou ze zkouškového archu, razítko správně/špatně
   PICTURE: velká karta otázky uprostřed, nad ní pruh postupu
   COLOUR: bílá, inkoust, petrolej EKO, bordó PRA, indigo UČE
   TYPE/LAYOUT: Libre Franklin; jeden sloupec max 760px, ovládání nahoře */
h1{font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bar button{font:600 15px Montserrat,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:16px 0 6px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(60,20,10,.35);margin-top:12px;position:relative}
.tag{display:inline-block;font:600 13px sans-serif;color:#fff;background:var(--acc);border-radius:6px;padding:2px 8px;margin-bottom:10px}
.q{font-size:clamp(20px,3.4vw,26px);font-weight:800;line-height:1.25;margin:0 0 18px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:16px/1.35 Montserrat,sans-serif;min-height:54px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}.opt.sel b{background:var(--acc);color:#fff}
.opt.miss{border-style:dashed}
.multi{font:600 13px sans-serif;color:var(--mut,#666);margin:-4px 0 12px}
.zt{display:inline-block;font:600 12px sans-serif;color:#7a4b00;background:#ffe9b8;border-radius:6px;padding:2px 8px;margin-left:6px}
.expl{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--bg);display:none}.expl.on{display:block}
.expl strong{display:block;margin-bottom:2px}
.next{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 16px Montserrat,sans-serif;min-height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.flip{min-height:300px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.flip .front{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.15;text-wrap:balance}
.flip .back{font-size:18px;line-height:1.5;text-align:left}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
.big{font-size:clamp(48px,10vw,88px);font-weight:800;line-height:1;margin:6px 0}
.note{color:var(--mut);font-size:13px;margin-top:28px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.cat{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:14px;margin:0 0 18px;max-width:520px}
.cat button{flex:1;font:800 15px Montserrat,sans-serif;min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--mut);cursor:pointer}
.cat button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.chs .g{display:flex;flex-direction:column;gap:6px}
.pill{align-self:flex-start;font:800 13px Montserrat,sans-serif;color:#fff;border-radius:999px;padding:4px 12px}
.pill.EKO{background:var(--eko)}.pill.PRA{background:var(--pra)}.pill.UCE{background:var(--uce)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;font:700 15px Montserrat,sans-serif;min-height:52px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.ch:hover{border-color:var(--acc)}
.ch small{color:var(--mut);font-weight:600;white-space:nowrap;text-align:right}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chead h2{margin:2px 0 0;font-size:clamp(22px,3.6vw,30px);line-height:1.15}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font:700 14px Montserrat,sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;text-decoration:none;white-space:nowrap}
.links a:hover{border-color:var(--acc)}
.wrongbar{margin-top:4px}
.wrongbar button{border-style:dashed}
[hidden]{display:none!important}
.ccount{color:var(--mut);font-size:13px;margin:-4px 0 8px}
</style></head><body>
<header class="nav"><div class="in"><a class="logo" href="index.html">Pololetka<span>1.P</span></a><a class="l" href="index.html">Plán</a><a class="l" href="ucivo.html">Učivo</a><a class="l" href="trenink.html" aria-current="page">Trénink</a><a class="l" href="dvojice.html">Ve dvou</a><a class="l" href="hra.html">Hra</a></div></header>
<div class="wrap" style="max-width:820px">
<h1>Trénink</h1>
<p class="sub">Kvíz s vysvětlením, kartičky a zkouška nanečisto. Klávesy 1–4 = odpověď, Enter = další, mezerník = otočit kartu.</p>
<div class="cat" id="cat"><button data-c="sec">Podle kapitol</button><button data-c="subj">Celé předměty</button><button data-c="hod">Test z hodiny</button></div>
<div id="top"></div>
<div id="tools">
<div class="bar" id="mode"><button data-m="quiz">Kvíz</button><button data-m="cards">Kartičky</button><button data-m="exam">Zkouška nanečisto</button></div>
<div class="bar" id="subj"><button data-s="ALL">Vše</button><button data-s="EKO">Ekonomika</button><button data-s="PRA">Právo</button><button data-s="UCE">Účetnictví</button></div>
<div class="bar wrongbar" id="wbar"><button id="wbtn">Moje chyby</button></div>
<div class="prog"><i id="pbar" style="width:0"></i></div>
<div class="meta"><span id="pos"></span><span id="score"></span></div>
</div>
<div id="stage"></div>
<p class="note">Otázky vznikly z učebních textů v Moodlu (1. ročník, 1. pololetí). Chyby a statistiky se ukládají jen v tomhle prohlížeči.</p>
</div>
<script src="data.js"></script>
<script>
{
const Q=window.Q,C=window.C,SECN=window.SECN;
const COL={EKO:"#0d7680",PRA:"#990f3d",UCE:"#3d4db7"},NAME={EKO:"Ekonomika",PRA:"Právo",UCE:"Účetnictví"};
// st.cat: "sec" (kapitola) | "subj" (celé předměty) | "hod" (test z hodiny – příznak 2); st.wr = jen moje chyby
let st={hs:"UCE",cat:"sec",sec:"",subj:"ALL",mode:"quiz",wr:false,list:[],i:0,ok:0,done:0,ans:false,flip:false,known:0};
let wrong=new Set();try{wrong=new Set(JSON.parse(localStorage.getItem("pp_wrong")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("pp_wrong",JSON.stringify([...wrong]))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const stage=$("stage");
const ALLQ=Q.map((q,k)=>({k,s:q[0],q:q[1],o:q[2],c:q[3],e:q[4],sec:q[5],t:q[6]||0,m:Array.isArray(q[3])}));
// správné indexy jako pole (i u jedné správné odpovědi)
const rights=x=>x.m?x.c:[x.c];
const rightText=x=>rights(x).map(i=>x.o[i]).join(" · ");
const isTF=x=>x.o.length===2&&x.o[0]==="Pravda";
function mix(x){if(isTF(x))return {...x};const idx=shuf(x.o.map((_,i)=>i));const o=idx.map(i=>x.o[i]);return {...x,o,c:x.m?x.c.map(i=>idx.indexOf(i)).sort((a,b)=>a-b):idx.indexOf(x.c)}}
const subjOf=sec=>sec.slice(0,3).toUpperCase();
const inScope=x=>st.cat==="hod"?x.t===2&&x.s===st.hs:st.cat==="sec"?x.sec===st.sec:(st.subj==="ALL"||x.s===st.subj);
const wrongCount=()=>ALLQ.filter(x=>wrong.has(x.k)&&inScope(x)).length;
const readMap=()=>{try{return JSON.parse(localStorage.getItem("pp_read")||"{}")}catch(e){return{}}};
function chapterCards(sec){
  const own=C.filter(c=>c[3]===sec).map(c=>({s:c[0],f:c[1],b:c[2]}));
  const fromQ=ALLQ.filter(x=>x.sec===sec).map(x=>({s:x.s,f:x.q,b:"<b>"+esc(rightText(x))+"</b><br>"+esc(x.e),html:1}));
  return shuf(own).concat(shuf(fromQ));
}
function build(){
  st.rest=[];
  if(st.cat==="sec"&&!st.sec)return picker();
  if(st.mode!=="cards"){
    let src=ALLQ.filter(inScope);
    if(st.wr)src=src.filter(x=>wrong.has(x.k));
    if(st.mode==="exam"&&!st.wr)src=st.cat!=="subj"?shuf(src).slice(0,20):st.subj==="ALL"?["EKO","PRA","UCE"].flatMap(x=>shuf(src.filter(y=>y.s===x)).slice(0,10)):shuf(src).slice(0,30);
    st.log=[];
    st.list=shuf(src).map(mix);st.sel=[];
  }else{
    st.list=st.cat==="hod"?shuf(ALLQ.filter(x=>x.t===2&&x.s===st.hs).map(x=>({s:x.s,f:x.q,b:"<b>"+esc(rightText(x))+"</b><br>"+esc(x.e),html:1}))):st.cat==="sec"?chapterCards(st.sec):shuf(C.filter(c=>st.subj==="ALL"||c[0]===st.subj).map(c=>({s:c[0],f:c[1],b:c[2]})));
  }
  st.i=0;st.ok=0;st.done=0;st.ans=false;st.flip=false;st.known=0;render();
}
function picker(){
  $("tools").hidden=true;$("top").innerHTML="";
  document.documentElement.style.setProperty("--acc","#46178f");
  const rd=readMap();
  stage.innerHTML='<p style="margin:0 0 14px">Vyber kapitolu. Kvíz, kartičky i zkouška nanečisto pak budou jen z ní.</p><div class="chs">'+["EKO","PRA","UCE"].map(g=>'<div class="g"><span class="pill '+g+'">'+NAME[g]+'</span>'+Object.keys(SECN).filter(k=>subjOf(k)===g).map(k=>{
    const n=ALLQ.filter(x=>x.sec===k).length,w=ALLQ.filter(x=>x.sec===k&&wrong.has(x.k)).length;
    return '<a class="ch" href="#sec-'+k+'"><span>'+esc(SECN[k])+(rd[k]?' ✓':'')+'</span><small>'+n+' otázek'+(w?'<br><span style="color:var(--bad)">'+w+' chyb</span>':'')+'</small></a>'}).join("")+'</div>').join("")+'</div>';
}
function header(){
  if(st.cat==="sec"){
    const g=subjOf(st.sec);
    $("top").innerHTML='<div class="chead"><div><span class="pill '+g+'">'+NAME[g]+'</span><h2>'+esc(SECN[st.sec])+'</h2></div><div class="links"><a href="#kapitoly">Jiná kapitola</a><a href="ucivo.html#'+st.sec+'">Přečíst</a><a href="dvojice.html#'+st.sec+'">Ve dvou</a></div></div>';
  }else if(st.cat==="hod"){
    const SRC={UCE:"„UČE 1.P – test za 1. pololetí“",PRA:"z Moodlu: základní právní pojmy + ústavní právo, soudnictví (oficiální řešení)"};
    const subs=["UCE","PRA","EKO"].filter(s=>ALLQ.some(x=>x.t===2&&x.s===s));
    $("top").innerHTML='<div class="chead"><div><h2>Test z hodiny</h2><div class="bar" style="margin:10px 0 0">'+subs.map(s=>'<a class="btn'+(s===st.hs?'':' ghost')+'" style="text-decoration:none" href="#hodina-'+s+'">'+NAME[s]+'</a>').join("")+'</div><p class="mut" style="margin:10px 0 0">Otázky '+SRC[st.hs]+' ('+ALLQ.filter(x=>x.t===2&&x.s===st.hs).length+' otázek). Přiřazovací úlohy jsou rozepsané po řádcích. Zkouška = 20 náhodných.</p></div></div>';
  }else $("top").innerHTML="";
}
function pressed(){
  $("tools").hidden=false;
  for(const b of document.querySelectorAll("#cat button"))b.setAttribute("aria-pressed",b.dataset.c===st.cat);
  for(const b of document.querySelectorAll("#mode button"))b.setAttribute("aria-pressed",b.dataset.m===st.mode&&!st.wr);
  $("subj").hidden=st.cat!=="subj";
  for(const b of document.querySelectorAll("#subj button"))b.setAttribute("aria-pressed",b.dataset.s===st.subj&&!st.wr);
  const n=wrongCount(),wb=$("wbtn");
  wb.textContent=(st.cat==="hod"?"Moje chyby z testu z hodiny":st.cat==="sec"?"Moje chyby z kapitoly":"Moje chyby"+(st.subj!=="ALL"?" – "+NAME[st.subj].toLowerCase():""))+" ("+n+")";
  wb.setAttribute("aria-pressed",st.wr);$("wbar").hidden=st.mode==="cards"&&!st.wr;
}
function render(){
  header();pressed();
  const n=st.list.length;
  $("pbar").style.width=(n?Math.min(st.i,n)/n*100:0)+"%";
  if(!n){stage.innerHTML='<div class="card"><p class="q">Tady zatím nic není.</p><p>'+(st.wr?"Žádné chyby, výborně. Dej si kvíz nebo zkoušku nanečisto.":"")+'</p></div>';$("pos").textContent="";$("score").textContent="";return}
  if(st.i>=n)return finish();
  const x=st.list[st.i];document.documentElement.style.setProperty("--acc",COL[x.s]);
  const lbl=st.wr?"Moje chyby · ":st.mode==="exam"?"Zkouška nanečisto · ":st.mode==="cards"?"Kartičky · ":"";
  $("pos").textContent=lbl+(st.i+1)+" / "+n;
  if(st.mode!=="cards"){
    $("score").textContent=st.mode==="exam"&&!st.wr?"Výsledek až na konci":"Správně "+st.ok+" z "+st.done;
    st.sel=[];
    stage.innerHTML='<div class="card"><span class="tag">'+(st.cat==="hod"?"Test z hodiny":st.cat==="sec"?esc(SECN[x.sec]):NAME[x.s])+'</span>'+(x.t===2&&st.cat!=="hod"?'<span class="zt">test z hodiny</span>':x.t===1?'<span class="zt">ze zkušebního testu</span>':'')+'<p class="q">'+esc(x.q)+'</p>'+(x.m?'<p class="multi">Označ všechny správné odpovědi a dej Potvrdit.</p>':'')+'<div class="opts">'+x.o.map((o,j)=>'<button class="opt" data-j="'+j+'"><b>'+(j+1)+'</b><span>'+esc(o)+'</span></button>').join("")+'</div><div class="expl" id="ex"></div><div class="next" id="nx">'+(x.m?'<button class="btn" id="chk">Potvrdit</button>':'')+'</div></div>';
  }else{
    $("score").textContent="Umím "+st.known;
    const back=x.html?x.b:esc(x.b);
    stage.innerHTML='<div class="card flip" id="fc" tabindex="0" role="button" aria-label="Otočit kartu"><span class="tag" style="align-self:center">'+NAME[x.s]+'</span>'+(st.flip?'<div class="front" style="font-size:20px;margin-bottom:12px">'+esc(x.f)+'</div><div class="back">'+back+'</div>':'<div class="front">'+esc(x.f)+'</div><p class="hint">Klikni nebo mezerník pro otočení</p>')+'</div><div class="next">'+(st.flip?'<button class="btn" data-k="1">Umím</button><button class="btn ghost" data-k="0">Ještě ne</button>':'')+'</div>';
  }
}
function answer(j){
  if(st.ans)return;const x=st.list[st.i];
  if(x.m&&!Array.isArray(j)){const p=st.sel.indexOf(j);if(p<0)st.sel.push(j);else st.sel.splice(p,1);stage.querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("sel",st.sel.includes(k)));return}
  st.ans=true;const R=rights(x),pick=Array.isArray(j)?j.slice().sort((a,b)=>a-b):[j],good=pick.length===R.length&&pick.every((v,i)=>v===R[i]);st.done++;
  if(good){st.ok++;wrong.delete(x.k)}else{wrong.add(x.k)}save();
  try{const S=JSON.parse(localStorage.getItem("pp_stats")||"{}");(S[x.s]=S[x.s]||[]).push(good?1:0);S[x.s]=S[x.s].slice(-200);localStorage.setItem("pp_stats",JSON.stringify(S))}catch(e){}
  if(st.mode==="exam"&&!st.wr){st.log.push({x,j:pick,good});stage.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(pick.includes(k))b.style.borderColor="var(--ink)"});setTimeout(next,250);return}
  stage.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");if(R.includes(k)){b.classList.add("ok");if(!pick.includes(k))b.classList.add("miss")}else if(pick.includes(k))b.classList.add("bad")});
  const ex=$("ex");ex.classList.add("on");ex.innerHTML='<strong style="color:'+(good?"var(--ok)":"var(--bad)")+'">'+(good?"Správně.":(x.m?"Správně jsou: ":"Správně je: ")+esc(rightText(x)))+'</strong>'+esc(x.e);
  $("nx").innerHTML='<button class="btn" id="go">Další otázka</button>';$("go").focus();
  $("score").textContent="Správně "+st.ok+" z "+st.done;pressed();
}
function next(){st.i++;st.ans=false;st.flip=false;render()}
const grade=p=>p>=90?1:p>=75?2:p>=60?3:p>=45?4:5;
function toWrong(){st.mode="quiz";st.wr=true;build()}
function finish(){
  document.documentElement.style.setProperty("--acc",st.cat==="sec"?COL[subjOf(st.sec)]:st.cat==="hod"?COL[st.hs]:"#0d7680");
  const where=st.cat==="hod"?" z testu z hodiny":st.cat==="sec"?" z kapitoly":"";
  if(st.mode==="exam"&&!st.wr){
    const p=st.done?Math.round(st.ok/st.done*100):0;
    const by=st.cat==="subj"?["EKO","PRA","UCE"].map(s=>{const a=st.log.filter(l=>l.x.s===s);return a.length?'<div style="display:flex;justify-content:space-between;font-weight:700;padding:4px 0"><span>'+NAME[s]+'</span><span>'+a.filter(l=>l.good).length+' / '+a.length+'</span></div>':""}).join(""):"";
    const bad=st.log.filter(l=>!l.good);
    stage.innerHTML='<div class="card"><p class="sub" style="margin:0">Zkouška nanečisto'+where+'</p><p class="big">'+p+' %</p><p>'+st.ok+' z '+st.done+' správně → známka <strong>'+grade(p)+'</strong>.</p>'+by+(bad.length?'<h2 style="margin-top:18px">Co si zopakovat</h2>'+bad.map(l=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(l.x.q)+'</b><br><span style="color:var(--bad)">Tvoje: '+esc(l.j.map(i=>l.x.o[i]).join(" · ")||"–")+'</span><br><span style="color:var(--ok)">Správně: '+esc(rightText(l.x))+'</span><br><span class="mut">'+esc(l.x.e)+'</span></div>').join(""):"")+'<div class="next"><button class="btn" id="again">Nová zkouška</button>'+(bad.length?'<button class="btn ghost" id="wr">Projet chyby v kvízu</button>':'')+'</div></div>';
  }else if(st.mode==="quiz"||st.wr){
    const p=st.done?Math.round(st.ok/st.done*100):0,n=wrongCount();
    stage.innerHTML='<div class="card"><p class="sub" style="margin:0">Hotovo'+(st.wr?" · moje chyby":"")+'</p><p class="big">'+p+' %</p><p>'+st.ok+' z '+st.done+' správně. Podle školní stupnice by to byla <strong>'+grade(p)+'</strong>.</p><div class="next"><button class="btn" id="again">Znovu</button>'+(n?'<button class="btn ghost" id="wr">Projet chyby'+where+' ('+n+')</button>':'')+(st.cat==="sec"&&!st.wr?'<button class="btn ghost" id="ex2">Zkouška nanečisto z kapitoly</button>':'')+'</div></div>';
    const e2=$("ex2");if(e2)e2.onclick=()=>{st.mode="exam";st.wr=false;build()};
  }else{
    const left=st.list.length-st.known;
    stage.innerHTML='<div class="card"><p class="big">'+st.known+' / '+st.list.length+'</p><p>Karet umíš. '+(left?left+' se vrátí v dalším kole.':'Všechno umíš.')+'</p><div class="next"><button class="btn" id="again">Další kolo</button></div></div>';
    $("again").onclick=()=>{if(st.rest&&st.rest.length){st.list=shuf(st.rest);st.rest=[];st.i=0;st.known=0;render()}else build()};
    return;
  }
  $("again").onclick=build;const w=$("wr");if(w)w.onclick=toWrong;
}
stage.addEventListener("click",e=>{
  const o=e.target.closest(".opt");if(o)return answer(+o.dataset.j);
  if(e.target.id==="chk")return answer(st.sel.slice());
  if(e.target.id==="go")return next();
  const k=e.target.closest("[data-k]");if(k){if(k.dataset.k==="1")st.known++;else (st.rest=st.rest||[]).push(st.list[st.i]);return next()}
  if(e.target.closest("#fc")){st.flip=!st.flip;render()}
});
$("mode").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.mode=b.dataset.m;st.wr=false;build()};
$("subj").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.subj=b.dataset.s;st.wr=false;go("#"+st.subj)};
$("wbtn").onclick=()=>{if(st.wr){st.wr=false;build()}else toWrong()};
$("cat").onclick=e=>{const b=e.target.closest("button");if(!b)return;go(b.dataset.c==="hod"?"#hodina":b.dataset.c==="sec"?(st.sec?"#sec-"+st.sec:"#kapitoly"):"#"+st.subj)};
const go=h=>{if(location.hash===h)route();else location.hash=h};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||!st.list.length||$("tools").hidden)return;
  if(st.mode!=="cards"){const x=st.list[st.i];if(!st.ans&&x&&e.key>="1"&&e.key<="9"&&+e.key<=x.o.length){e.preventDefault();answer(+e.key-1)}else if(!st.ans&&x&&x.m&&e.key==="Enter"){e.preventDefault();answer(st.sel.slice())}else if(st.ans&&e.key==="Enter"){e.preventDefault();next()}}
  else if(e.key===" "){e.preventDefault();st.flip=!st.flip;render()}
});
function route(){
  const h=location.hash.slice(1);
  st.wr=false;
  if(h.startsWith("sec-")&&SECN[h.slice(4)]){st.cat="sec";st.sec=h.slice(4);st.mode="quiz"}
  else if(h==="kapitoly"||h===""){st.cat="sec";st.sec=""}
  else if(["EKO","PRA","UCE","ALL"].includes(h)){st.cat="subj";st.subj=h}
  else if(h==="WRONG"){st.cat="subj";st.subj="ALL";st.mode="quiz";st.wr=true}
  else if(h==="EXAM"){st.cat="subj";st.subj="ALL";st.mode="exam"}
  else if(h==="hodina"){st.cat="hod";st.mode="quiz"}
  else if(/^hodina-(UCE|PRA|EKO)$/.test(h)){st.cat="hod";st.hs=h.slice(7);st.mode="quiz"}
  else if(h==="hodina-zkouska"){st.cat="hod";st.mode="exam"}
  else if(h==="karticky"){st.cat="subj";st.mode="cards"}
  for(const b of document.querySelectorAll("#cat button"))b.setAttribute("aria-pressed",b.dataset.c===st.cat);
  build();
}
window.addEventListener("hashchange",route);route();
}
</script></body></html>
